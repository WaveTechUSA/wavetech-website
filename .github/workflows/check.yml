name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: GHL blocks are generated from the pages (no hand edits)
        run: node tools/make-ghl.js --check
      - name: Install Playwright Chromium
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Smoke-test standalone pages
        run: node tools/smoke.js
      - name: Smoke-test GHL paste blocks (simulated builder page)
        run: node tools/smoke.js --ghl
