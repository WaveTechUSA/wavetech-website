      fz(arr, w, h, cx, cy, cz + d / 2, '', top, r);
      if (under) fz(arr, w, h, cx, cy, cz - d / 2, 'rotateY(180deg)', hsl(H, S, L * .4), r);
      fz(arr, d, h, cx + w / 2, cy, cz, 'rotateY(90deg)', hsl(H, S, L * .85), 0);
      fz(arr, d, h, cx - w / 2, cy, cz, 'rotateY(-90deg)', hsl(H, S, L * .7), 0);
      fz(arr, w, d, cx, cy - h / 2, cz, 'rotateX(90deg)', hsl(H, S, L * .6), 0);
      fz(arr, w, d, cx, cy + h / 2, cz, 'rotateX(-90deg)', hsl(H, S, L * .95), 0);
    };
    const cz = (arr, cx, cy, zc, r, len, n0, H, S, L, topBg) => {
      const n = Math.min(n0, 8);
      const chord = 2 * r * Math.tan(Math.PI / n) * 1.04;
      for (let i = 0; i < n; i++) {
        const a = i * 360 / n;
        const l = L * (0.62 + 0.38 * Math.cos((a - 200) * Math.PI / 180));
        arr.push({ w: chord, h: len, r: 0, bg: hsl(H, S, l), tf: 'translate3d(' + (PX(cx) - chord / 2) + 'px, ' + (PY(cy) - len / 2) + 'px, ' + zc + 'px) rotateZ(' + a + 'deg) translateY(' + (-r) + 'px) rotateX(90deg)' });
      }
      fz(arr, 2 * r, 2 * r, cx, cy, zc + len / 2, '', topBg || hsl(H, S, L * 1.2), r);
    };
    const PCB = 'repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 7px), repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 11px), #15161C';
    const PCB2 = 'repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 8px), repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 12px), #121318';
    const PINS = 'radial-gradient(circle, #D8B45A 0 1.3px, transparent 1.7px) 1px 1px / 4px 4px, #161616';
    const PINROW = 'radial-gradient(circle, #D8B45A 0 1.2px, transparent 1.6px) 2px 50% / 4px 100% no-repeat padding-box, #F2F2F7';
    const HOLES = 'radial-gradient(circle, #23252B 0 1.1px, transparent 1.5px) 1px 3px / 4px 9px, #F2F2F7';
    const HOLES1 = 'radial-gradient(circle, #23252B 0 1.1px, transparent 1.5px) 1px 2px / 4px 8px, #F2F2F7';
    const SILVER = 'linear-gradient(180deg, #D5D9E0, #AEB5C0)';
    const PERF = 'radial-gradient(circle, #10141C 0 1.9px, transparent 2.4px) 0 0 / 9px 9px, #2A3140';
    const PERF2 = 'radial-gradient(circle, #4A5262 0 1.3px, transparent 1.8px) 0 0 / 5px 5px, #9AA3B0';
    const LEDS = 'radial-gradient(circle, #3A5078 0 1.1px, transparent 1.4px) 0 0 / 5px 5px, #0A0F18';
    const gray = [228, 8, 26], black = [228, 6, 10], white = [228, 10, 88], silver = [220, 8, 70], blue = [196, 90, 48], pcbC = [228, 8, 9];
    const standoffXs = [-262, -187, -112, -37, 37, 112, 187, 262];

    // 5 · chassis (with its own side walls, so the assembled cabinet is a closed box)
    const xChassis = [];
    bz(xChassis, 0, 0, -4, 560, 315, 8, PERF, gray, 2);
    const wallTop = 'linear-gradient(90deg, #3A4252, #2E3542)';
    bz(xChassis, 0, -163.5, 23, 584, 12, 62, wallTop, [228, 8, 24], 1);
    bz(xChassis, 0, 163.5, 23, 584, 12, 62, wallTop, [228, 8, 24], 1);
    bz(xChassis, -286, 0, 23, 12, 339, 62, wallTop, [228, 8, 24], 1);
    bz(xChassis, 286, 0, 23, 12, 339, 62, wallTop, [228, 8, 24], 1);
    bz(xChassis, -120, 0, 3, 36, 76, 6, '#4A5365', [228, 8, 30], 6);
    bz(xChassis, 120, 0, 3, 36, 76, 6, '#4A5365', [228, 8, 30], 6);
    bz(xChassis, 0, -146, 4, 84, 22, 8, '#0DB5EC', blue, 2);
    bz(xChassis, 0, 146, 4, 84, 22, 8, '#0DB5EC', blue, 2);
    cz(xChassis, -255, -146, 6, 7, 12, 10, 220, 8, 62);
    cz(xChassis, 255, -146, 6, 7, 12, 10, 220, 8, 62);
    for (const y of [-60, 60]) cz(xChassis, -270, y, 3, 5, 6, 8, 220, 8, 55);
    for (const x of [-150, 150]) cz(xChassis, x, -150, 3, 5, 6, 8, 220, 8, 55);
    for (const [x, y] of [[-200, -80], [200, -80], [-200, 80], [200, 80]]) cz(xChassis, x, y, 2, 9, 4, 10, 228, 8, 36, '#1A1F2A');
    bz(xChassis, 130, 120, 1.5, 56, 22, 3, PCB, pcbC, 1);
    cz(xChassis, 116, 120, 5, 3, 4, 8, 0, 85, 55, '#FF5A4E');
    cz(xChassis, 130, 120, 5, 3, 4, 8, 140, 70, 50, '#3BD27A');
    cz(xChassis, 144, 120, 5, 3, 4, 8, 222, 90, 60, '#4F7BFF');
    bz(xChassis, -150, 120, 2, 16, 14, 4, '#3BD27A', [140, 60, 40], 1);
    for (const x of standoffXs) { cz(xChassis, x, -140, 7, 4, 14, 8, 220, 8, 62); cz(xChassis, x, 140, 7, 4, 14, 8, 220, 8, 62); }

    // 4 · power supplies + PDU
    const xPsu = [];
    for (const sgn of [-1, 1]) {
      const px = sgn * 120;
      bz(xPsu, px, 0, 9, 175, 190, 18, PERF2, [228, 8, 62], 2);
      bz(xPsu, px, 12, 19, 120, 30, 2, '#F2F2F7', white, 1);
      bz(xPsu, px - 55, 76, 22, 36, 20, 8, PINS, black, 1);
      bz(xPsu, px + 45, 76, 22, 44, 20, 8, PINROW, white, 1);
      bz(xPsu, px + 50, -72, 21, 30, 14, 6, '#161616', black, 1);
      for (let k = 0; k < 4; k++) cz(xPsu, px - 70 + k * 14, -70, 21, 3, 5, 6, 220, 8, 50);
    }
    bz(xPsu, 0, 0, 8, 64, 150, 16, 'repeating-linear-gradient(45deg, rgba(220,220,240,.45) 0 1px, transparent 1px 5px), #5B6676', [228, 8, 38], 1);
    bz(xPsu, 0, -40, 20, 44, 16, 8, '#111', black, 1);
    bz(xPsu, 0, 40, 20, 44, 16, 8, '#111', black, 1);
    for (const sgn of [-1, 1]) {
      bz(xPsu, sgn * 50, -30, 18, 40, 4, 4, '#D83A3A', [0, 70, 42], 2);
      bz(xPsu, sgn * 50, -20, 18, 40, 4, 4, '#111', black, 2);
    }

    // 3 · receiving cards (modelled on a receiving card: six pin headers, BGA, RJ45, power header, caps, LEDs)
    const xRc = [];
    for (const cxr of [-62, 62]) {
      bz(xRc, cxr, 0, 1.5, 118, 150, 3, PCB, pcbC, 2);
      for (const x of [-40, -14, 12]) { bz(xRc, cxr + x, -55, 6.5, 16, 30, 7, PINS, black, 1); bz(xRc, cxr + x, 55, 6.5, 16, 30, 7, PINS, black, 1); }
      bz(xRc, cxr - 6, 0, 4.5, 34, 34, 3, 'linear-gradient(135deg, #2A2A2E, #121214)', black, 1);
      bz(xRc, cxr - 34, 8, 4, 14, 8, 2, '#1A1A1A', black, 0);
      bz(xRc, cxr - 34, -6, 4, 14, 8, 2, '#1A1A1A', black, 0);
      bz(xRc, cxr + 46, -4, 8, 22, 32, 10, SILVER, silver, 1);
      bz(xRc, cxr + 30, 58, 6, 20, 10, 6, PINROW, white, 1);
      cz(xRc, cxr + 24, -58, 5, 2.5, 4, 6, 0, 85, 55, '#FF5A4E');
      cz(xRc, cxr + 32, -58, 5, 2.5, 4, 6, 140, 70, 50, '#3BD27A');
      for (const y of [-14, 0, 14]) cz(xRc, cxr - 50, y, 6.5, 4, 7, 8, 228, 6, 18, '#0E0E10');
      for (const [x, y] of [[-52, -68], [52, -68], [-52, 68], [52, 68]]) cz(xRc, cxr + x, y, 3.5, 3, 1, 8, 220, 8, 70);
    }

    // 2 · hub board
    const xHub = [];
    bz(xHub, 0, 0, 1.5, 540, 290, 3, PCB2, [228, 8, 8], 2);
    for (const y of [-72, 72]) for (const x of [-200, -67, 67, 200]) bz(xHub, x, y, 6, 70, 18, 6, HOLES, white, 1);
    for (const x of [-33, -11, 11, 33]) bz(xHub, x, 0, 7.5, 20, 22, 9, SILVER, silver, 1);
    for (const x of [-62, 62]) bz(xHub, x, 0, 2, 122, 154, 4, '#0B0C10', [228, 6, 5], 2);
    for (const sgn of [-1, 1]) { bz(xHub, sgn * 150, -128, 6.5, 26, 14, 7, HOLES1, white, 1); bz(xHub, sgn * 185, -128, 5.5, 12, 8, 5, HOLES1, white, 0); }
    bz(xHub, 150, 128, 5.5, 16, 8, 5, HOLES1, white, 0);
    for (const x of [-100, -80, -60, 60, 80, 100]) cz(xHub, x, -128, 6.5, 5, 7, 8, 228, 6, 18, '#0E0E10');
    for (const x of standoffXs) { cz(xHub, x, -140, 4, 3.5, 2, 8, 220, 8, 70); cz(xHub, x, 140, 4, 3.5, 2, 8, 220, 8, 70); }

    // 1 · LED face: one seamless surface with a hole where the lifted card sits; the dot period divides both tile sizes
    const LEDTEX = 'radial-gradient(circle, #3A5078 0 1px, transparent 1.3px) 0 0 / 4.375px 4.375px, #0A0F18';
    const xCards = [], xLift = [];
    bz(xCards, 0, 0, 3, 560, 315, 6, LEDTEX, [222, 14, 7], 0);
    xCards[0].clip = 'polygon(evenodd, 0 0, 560px 0, 560px 315px, 0 315px, 0 0, 140px 157.5px, 140px 315px, 280px 315px, 280px 157.5px, 140px 157.5px)';
    fz(xCards, 140, 157.5, -70, 78.75, 0.2, '', '#0B0C10', 0);
    bz(xLift, -70, 78.75, 3, 140, 157.5, 6, 'radial-gradient(circle, #3A5078 0 1px, transparent 1.3px) -140px -157.5px / 4.375px 4.375px, #0A0F18', [222, 14, 7], 0, true);

    // cables between the layers (this group scales with the explosion)
    const xRibbons = [];
    bz(xRibbons, 150, 118, 118, 12, 2, 236, '#E6E6EE', white, 0);
    bz(xRibbons, 0, -70, 174, 18, 2, 132, '#B9B9CC', [228, 10, 70], 0);
    for (const sgn of [-1, 1]) {
      bz(xRibbons, sgn * 150, -100, 172, 4, 4, 128, '#D83A3A', [0, 70, 42], 2);
      bz(xRibbons, sgn * 140, -100, 172, 4, 4, 128, '#111', black, 2);
      bz(xRibbons, sgn * 62, 70, 201, 100, 3, 76, '#D5D9DF', white, 0);
    }
    // PTZ camera, ceiling-mounted (upside down): ceiling plate, round base, yoke arms, rounded head, barrel lens
    const camGray = [228, 8, 30], camDark = [228, 8, 20];
    const baseFaces = [];
    cylY(baseFaces, 0, -46, 0, 20, 4, 12, 228, 6, 36);            // ceiling plate
    cylY(baseFaces, 0, -38, 0, 25, 12, 16, camDark[0], camDark[1], camDark[2]);   // base disc with the status LEDs
    const armFaces = [];
    const armMat = mat(camGray[0], camGray[1], camGray[2]);
    box(armFaces, -22, -14, -2, 7, 38, 22, armMat, 3);
    box(armFaces, 22, -14, -2, 7, 38, 22, armMat, 3);
    box(armFaces, 0, -30, -2, 44, 6, 22, armMat, 3);            // bridge under the base
    const headFaces = [];
    box(headFaces, 0, 0, 0, 32, 26, 30, mat(camGray[0], camGray[1], camGray[2] * 1.05), 10);
    cylZ(headFaces, 0, 0, 22, 10, 14, 14, 228, 8, 16);           // lens barrel, glass on its front

    const ceilTf = ctr(760, 560, 0, -180, -40, 'rotateX(-90deg)');
    const leftScreenTf = ctr(304, 172, -162, -58, -279.6, '');
    const rightScreenTf = ctr(304, 172, 162, -58, -279.6, '');
    const cam1Tf = tf(-300, -132, -190);
    const cam2Tf = tf(300, -132, -190);
    const mic1RingTf = ctr(50, 50, -100, -175.2, 10, 'rotateX(90deg)');
    const mic2RingTf = ctr(50, 50, 100, -175.2, 10, 'rotateX(90deg)');
    const panelTf = tf(140, 85, 48, 'rotateX(60deg)');
    const panelScreenTf = ctr(70, 48, 0, -27, 4.2, '');
    const lidTf = tf(-130, 87, 18, 'rotateX(14deg)');
    const lidScreenTf = ctr(56, 34, 0, -21, 1.7, '');
    const rackTf = ctr(92, 44, 0, 112, -269.4, '');

    const tiles = [
      { name: 'ROOM', bg: '#131326', av: '#3A3A5C' },
      { name: 'REMOTE 1', bg: '#161630', av: '#4A3A6C' },
      { name: 'REMOTE 2', bg: '#131326', av: '#3A4A6C' },
      { name: 'PRESENTER', bg: '#161630', av: '#4A4A7C' }
    ];
    const events = [
      { cls: 'ev1', n: '01', t: 'Walk in', b: 'Both walls show the meeting home screen, mics live, cameras on their home shots.' },
      { cls: 'ev2', n: '02', t: 'Pick your sources', b: 'One tap puts the call on the left wall and the laptop on the right.' },
      { cls: 'ev3', n: '03', t: 'Frame the room', b: 'Tap a camera preset and both ceiling cameras move to their saved shots.' },
      { cls: 'ev4', n: '04', t: 'Mute the room', b: 'The ceiling mics go red and the far end sees it.' },
      { cls: 'ev5', n: '05', t: 'Carry on', b: 'Unmute, finish the meeting, tap Shutdown. The room resets itself.' }
    ];

    const layers = [
      { n: '1', dot: '#543BB9', name: 'Pixel cards', body: 'The LEDs themselves. Eight per cabinet, and each one lifts off the front without a cable.' },
      { n: '2', dot: '#2DAA5E', name: 'Hub board', body: 'Feeds data and power to every pixel card.' },
      { n: '3', dot: '#0DB5EC', name: 'Receiving cards', body: 'Two per cabinet. One runs the picture, the other stands by in case it fails.' },
      { n: '4', dot: '#8D96A3', name: 'Power supplies', body: 'Two in parallel. If one fails, the other carries the cabinet.' },
      { n: '5', dot: '#4A5365', name: 'Cabinet', body: 'A fan-free housing that doubles as the heat sink, with status lights on the back.' }
    ];

    const pitches = [
      { label: '0.95', mm: 0.95, wall: '3840 × 2160', wallNote: '4K', ft: '~10 ft' },
      { label: '1.27', mm: 1.266, wall: '2880 × 1620', wallNote: 'beyond Full HD', ft: '~13 ft' },
      { label: '1.58', mm: 1.583, wall: '2304 × 1296', wallNote: 'beyond Full HD', ft: '~16 ft' },
      { label: '1.90', mm: 1.90, wall: '1920 × 1080', wallNote: 'Full HD', ft: '~19 ft' },
      { label: '2.53', mm: 2.533, wall: '1440 × 810', wallNote: 'below Full HD', ft: '~25 ft' },
      { label: '3.17', mm: 3.167, wall: '1152 × 648', wallNote: 'below Full HD', ft: '~32 ft' },
      { label: '3.80', mm: 3.80, wall: '960 × 540', wallNote: 'quarter HD', ft: '~38 ft' }
    ];
    const sel = pitches[this.state.pi];
    const p = Object.assign({}, sel, { cellX: (sel.mm / 48 * 100).toFixed(3), cellY: (sel.mm / 27 * 100).toFixed(3) });
    const pitchButtons = pitches.map((x, i) => {
      const on = i === this.state.pi;
      return { label: x.label, pressed: on ? 'true' : 'false', bg: on ? '#00C4EC' : 'transparent', bd: on ? '#00C4EC' : '#03485A', fg: on ? '#090916' : '#00C4EC', pick: () => this.setState({ pi: i }) };
    });

    const W = 100 / 24, H = 100 / 12;
    const card = (c, r) => ({ x: (c * W).toFixed(3), y: (r * H).toFixed(3), w: W.toFixed(3), h: H.toFixed(3) });
    const dark = '#05070B';
    const cater = 'repeating-linear-gradient(90deg, #FF3B3B 0 2px, #22C55E 2px 4px, #3B6BFF 4px 6px, #05070B 6px 10px)';
    const faults = [
      Object.assign({ cls: 'rx1', bg: cater }, card(17, 0)),
      Object.assign({ cls: 'rx2', bg: dark }, card(1, 3)),
      { cls: 'rx3', bg: dark, x: '50', y: '33.333', w: '16.667', h: '16.667' },
      Object.assign({ cls: 'rx4', bg: dark }, card(11, 8)),
      Object.assign({ cls: 'rx5', bg: dark }, card(22, 11))
    ];
    const rescue = [
      { cls: 'st1', n: '01', t: 'Flag', b: 'The wall tells us which cabinets are unhappy before anyone in the room notices.' },
      { cls: 'st2', n: '02', t: 'Diagnose', b: 'Each fault is traced to its cause before a part is replaced.' },
      { cls: 'st3', n: '03', t: 'Replace', b: 'Matched spares from your kit, fitted from the front of the wall.' },
      { cls: 'st4', n: '04', t: 'Recalibrate', b: 'New parts are matched to their neighbours until the wall is seamless again.' },
      { cls: 'st5', n: '05', t: 'Log', b: 'Every swap is recorded and the spares kit is refilled for next time.' }
    ];
    const scope = [
      { phase: 'Site survey', includes: 'We measure the wall, check structure, power and data, and look at sightlines for cameras and mics.', gets: 'A survey report' },
      { phase: 'Design', includes: 'Wall size and pitch, cabinet layout, processing, cameras, mics and control — all drawn before anything is ordered.', gets: 'Drawings and a fixed price' },
      { phase: 'Installation', includes: 'Mounting, cabinets, cabling, rack, cameras, mics and panels, coordinated with your contractor.', gets: 'A finished room' },
      { phase: 'Commissioning', includes: 'Calibration, seams, audio tuning, camera presets, the touch-panel interface and training.', gets: 'A commissioning report and as-builts' },
      { phase: 'Service', includes: 'Maintenance visits, spares on hand, remote diagnostics and on-site response.', gets: 'An annual service agreement' }
    ];
    return {
      cells, layers, xChassis, xPsu, xRc, xHub, xCards, xLift, xRibbons,
      roomFaces, panelFaces, lidFaces, baseFaces, armFaces, headFaces, ceilTf, leftScreenTf, rightScreenTf, cam1Tf, cam2Tf, mic1RingTf, mic2RingTf, panelTf, panelScreenTf, lidTf, lidScreenTf, rackTf, tiles, events,
      p, pitchButtons, faults, rescue, scope,
      submitLabel: this.state.sent ? 'Thanks — we’ll be in touch' : 'Request a site survey',
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}
